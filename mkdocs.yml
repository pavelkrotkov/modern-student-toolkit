site_name: Modern Student Toolkit
site_description: Практическая цифровая грамотность для современного студента
site_url: https://pavelkrotkov.github.io/modern-student-toolkit/
repo_url: https://github.com/pavelkrotkov/modern-student-toolkit
repo_name: modern-student-toolkit
edit_uri: edit/main/docs/

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true

validation:
  links:
    anchors: warn

nav:
  - Главная: index.md
  - Учебная работа:
      - 0. Подготовка: 00-start.md
      - 0а. Пароли и браузер: 00a-passwords-browser.md
      - 1. Mac и файлы: 01-files-terminal.md
      - 2. Работа с ИИ: 03-chat-work-codex.md
      - 3. Источники и заметки: 07-obsidian.md
      - 4. Документ и таблица: 10-office-research.md
      - 4а. Ошибки в таблице: spreadsheet-lab.md
      - 4б. Совместная работа и итог: collaboration.md
  - Техническая самостоятельность:
      - 5. Terminal и Homebrew: 02-homebrew.md
      - 6. Агент и файлы: 04-codex-folders-computer-use.md
      - 7. Git и GitHub: 06-git-github.md
      - 8. Немного Python: 09-python-literacy.md
      - 9. Итоговая работа: 12-capstone.md
  - Повторение и помощь:
      - Задача через неделю: transfer-check.md
      - Личный журнал: progress.md
      - Подсказки по одной: hints.md
      - Если застрял: help.md
      - Если окно отличается: interface-reference.md
  - Дополнительно:
      - Задания по внешним материалам: extensions.md
      - MIT Missing Semester: 05-missing-semester.md
      - Навык $teach-me: 08-skills.md
      - Резервные копии и обслуживание: 11-maintenance.md
  - Шпаргалки:
      - Terminal: cheatsheets/terminal.md
      - Homebrew: cheatsheets/homebrew.md
      - Git: cheatsheets/git.md
      - Работа с ИИ: cheatsheets/codex.md
  - Учебные источники:
      - Условия поездки: practice/trip-brief.md
      - Расценки: practice/trip-prices.md
      - Заказ для студенческого клуба: practice/print-brief.md
  - Ссылки и источники: resources.md
