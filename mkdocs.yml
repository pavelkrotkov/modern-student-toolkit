site_name: Modern Student Toolkit
site_description: Практическая цифровая грамотность для современного студента
site_url: https://pavelkrotkov.github.io/modern-student-toolkit/
repo_url: https://github.com/pavelkrotkov/modern-student-toolkit
repo_name: pavelkrotkov/modern-student-toolkit
edit_uri: edit/main/docs/

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true

nav:
  - Главная: index.md
  - 0. Начало: 00-start.md
  - 1. Файлы, папки и Terminal: 01-files-terminal.md
  - 2. Homebrew и программы: 02-homebrew.md
  - 3. Chat, Work и Codex: 03-chat-work-codex.md
  - "4. Codex: папки и Computer Use": 04-codex-folders-computer-use.md
  - 5. MIT Missing Semester: 05-missing-semester.md
  - 6. Git и GitHub: 06-git-github.md
  - 7. Obsidian + GitHub: 07-obsidian.md
  - 8. Skills и $teach-me: 08-skills.md
  - 9. Python без курса программирования: 09-python-literacy.md
  - 10. Учёба, документы и источники: 10-office-research.md
  - 11. Поддержание Mac в порядке: 11-maintenance.md
  - Шпаргалки:
      - Terminal: cheatsheets/terminal.md
      - Homebrew: cheatsheets/homebrew.md
      - Git: cheatsheets/git.md
      - Codex: cheatsheets/codex.md
  - Ссылки и источники: resources.md
